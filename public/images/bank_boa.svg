    </g>
  </g>
  <text x="160" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#15803D" text-anchor="middle" letter-spacing="2">BOA</text>
  <text x="160" y="156" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#166534" text-anchor="middle" letter-spacing="1.5">BANK OF AGRICULTURE</text>
