      <circle cx="0" cy="0" r="17" fill="#15803D" />
      <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">B</text>
    </g>
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="17" fill="#15803D" stroke="#FFFFFF" stroke-width="2" />
      <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">O</text>
    </g>
    <g transform="translate(34, 0)">
